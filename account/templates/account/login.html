{% extends 'base.html' %}

{% block title %}
	Login
{% endblock %}

{% block body %}
    <div class="d-flex justify-content-center align-items-center vh-100">
        <form method="POST" class="col-md-4 p-4 border rounded shadow bg-white">
            <h2 class="mb-3 text-center">Login</h2>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    {{ field.label_tag }}
                    {{ field }}
                    <div class="text-danger">{{ field.errors }}</div>
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100">Submit</button>

            <div class="mt-3 text-center">
                <a href="{% url 'account:reset_password' %}" class="text-decoration-none">Forgot your password?</a>
            </div>
        </form>
    </div>
{% endblock %}
