{% extends 'base.html' %}

{% block title %}
    Update Profile Information
{% endblock %}

{% block body %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Form Card -->
                <div class="card shadow-sm border-light">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">Update Your Profile</h3>
                    </div>
                    <div class="card-body">
                        <form action="" method="post">
                            {% csrf_token %}

                            <!-- Bio Field -->
                            <div class="mb-4">
                                <label for="{{ form.bio.id_for_label }}" class="form-label">Bio</label>
                                {{ form.bio }}
                                <div class="text-danger">{{ form.bio.errors }}</div>
                            </div>

                            <!-- Age and Gender Fields in a Single Row -->
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="{{ form.age.id_for_label }}" class="form-label">Age</label>
                                    {{ form.age }}
                                    <div class="text-danger">{{ form.age.errors }}</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="{{ form.gender.id_for_label }}" class="form-label">Gender</label>
                                    {{ form.gender }}
                                    <div class="text-danger">{{ form.gender.errors }}</div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary w-100">Update Profile</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
