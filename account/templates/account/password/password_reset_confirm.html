{% extends 'base.html' %}

{% block title %}
	Confirm
{% endblock %}

{% block body %}
    {% if validlink %}
    <h4 class="text">Confirm your password</h4>
    <form method="post" class="mt-4 col-lg-4" >
        {% csrf_token %}
        {% for foo in form %}
            <div class="mt-2">
        	{{ foo }}
            {{ foo.errors }}
            </div>
        {% endfor %}
        <input type="submit" value="Send" class="btn btn-primary mt-3">
    </form>
    {% else %}
    <p class="text-center">This link is not valid.</p>
    {% endif %}

{% endblock %}
