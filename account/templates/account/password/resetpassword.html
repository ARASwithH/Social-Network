{% extends 'base.html' %}

{% block title %}
	reset password
{% endblock %}

{% block body %}
    <h4 class="text">Enter your signed email</h4>
    <form method="post" class="mt-4 col-lg-4">
        {% csrf_token %}
        {% for foo in form %}
        	{{ foo }}
            {{ foo.errors }}
        {% endfor %}
        <input type="submit" value="Send" class="btn btn-primary mt-3">
    </form>
{% endblock %}
