{% extends 'base.html' %}

{% block title %}
    Edit Post
{% endblock %}

{% block body %}
    <div class="container mt-5">
        <!-- Main Container -->
        <div class="d-flex justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Edit Post Card -->
                <div class="card shadow-sm">
                    <div class="card-header bg-primary-subtle text-center">
                        <h3>Edit Post</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}

                            <!-- Post Title -->
                            <div class="mb-3">
                                <label for="{{ post_form.title.id_for_label }}" class="form-label">Title</label>
                                {{ post_form.title }}
                                <div class="text-danger">{{ post_form.title.errors }}</div>
                            </div>

                            <!-- Post Content -->
                            <div class="mb-3">
                                <label for="{{ post_form.content.id_for_label }}" class="form-label">Content</label>
                                {{ post_form.content }}
                                <div class="text-danger">{{ post_form.content.errors }}</div>
                            </div>



                            <!-- Save Button -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
